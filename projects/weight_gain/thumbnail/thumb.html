<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'League Spartan';src:url(../../../pipeline/thumbnail/ls_2.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'PJ';src:url(../../../pipeline/thumbnail/pj800.woff2) format('woff2');font-weight:800;}
:root{--navy:#04254F;--navy2:#021838;--yellow:#FFE100;--teal:#2EC4B6;--coral:#E76F51;}
html,body{margin:0;background:#000}
.card{position:relative;width:1080px;overflow:hidden;background:var(--navy2);}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.05);}
.shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(2,24,56,.92) 0%,rgba(2,24,56,.55) 30%,rgba(2,24,56,.05) 52%,rgba(2,24,56,.0) 70%,rgba(2,24,56,.75) 100%),
  linear-gradient(90deg,rgba(2,24,56,.0) 40%,rgba(2,24,56,.55) 100%);}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(46,196,182,.45) 0%,rgba(46,196,182,.12) 40%,rgba(46,196,182,0) 68%);}
.chip{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--teal);color:var(--navy);font:800 40px 'PJ';
  letter-spacing:4px;padding:14px 34px 12px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;}
.head{position:absolute;left:0;width:1080px;text-align:center;font-family:'League Spartan';font-weight:800;color:#fff;line-height:.96;letter-spacing:-1px;
  text-shadow:0 6px 0 rgba(2,24,56,.6),0 14px 40px rgba(0,0,0,.6);}
.head .y{color:var(--yellow)}
.head .big{font-size:1.45em;color:var(--yellow);display:inline-block;transform:rotate(-3deg)}
.mark{display:inline-block;background:var(--coral);color:#fff;padding:0 18px 0;border-radius:14px;transform:rotate(-1.5deg);text-shadow:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.person{position:absolute;filter:drop-shadow(0 0 2px rgba(0,0,0,.4)) drop-shadow(0 30px 60px rgba(0,0,0,.55));}
.rim{position:absolute;filter:blur(16px) brightness(0) invert(1) sepia(1) hue-rotate(120deg) saturate(4);opacity:.45;}
.tag{position:absolute;background:rgba(2,24,56,.82);color:#fff;font:800 30px 'PJ';padding:12px 24px;border-radius:16px;border-left:8px solid var(--teal);white-space:nowrap}
.tag small{display:block;font:800 22px 'PJ';color:var(--teal);letter-spacing:3px;margin-top:4px}
/* 9:16 */
#t916{height:1920px}
#t916 .glow{width:1100px;height:1100px;left:200px;top:900px}
#t916 .chip{top:150px}
#t916 .head{top:250px;font-size:118px}
#t916 .person,#t916 .rim{width:1080px;right:-170px;bottom:0}
#t916 .tag{left:50px;bottom:120px}
/* 4:5 */
#t45{height:1350px}
#t45 .bg{object-position:50% 62%}
#t45 .glow{width:900px;height:900px;left:260px;top:520px}
#t45 .chip{top:46px;font-size:32px}
#t45 .head{top:120px;font-size:92px}
#t45 .person,#t45 .rim{width:820px;right:-130px;bottom:0}
#t45 .tag{left:40px;bottom:60px;font-size:26px}
</style></head>
<body>
<div class="card" id="t916">
  <img class="bg" src="bg_m04.jpg"><div class="shade"></div><div class="glow"></div>
  <div class="chip">UBAT PSIKIATRI</div>
  <div class="head"><span class="big">10</span> Ubat Ini<br>Boleh Buat<br><span class="mark">Berat Badan</span><br><span class="y">Naik!</span></div>
  <img class="rim" src="../../../pipeline/thumbnail/person_final.png"><img class="person" src="../../../pipeline/thumbnail/person_final.png">
  <div class="tag">Dr Azren<small>DOKTOR PSIKIATRI</small></div>
</div>
<div class="card" id="t45">
  <img class="bg" src="bg_m04.jpg"><div class="shade"></div><div class="glow"></div>
  <div class="chip">UBAT PSIKIATRI</div>
  <div class="head"><span class="big">10</span> Ubat Ini<br>Boleh Buat<br><span class="mark">Berat Badan</span><br><span class="y">Naik!</span></div>
  <img class="rim" src="../../../pipeline/thumbnail/person_final.png"><img class="person" src="../../../pipeline/thumbnail/person_final.png">
  <div class="tag">Dr Azren<small>DOKTOR PSIKIATRI</small></div>
</div>
</body></html>
